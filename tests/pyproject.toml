# Python project metadata, including dependencies & tool settings               
# https://snarky.ca/what-the-heck-is-pyproject-toml

[project]
name = "ok_arduino_clock64_tests"
version = "0.1"
requires-python = ">=3.12"

dependencies = [
  "ok-logging-setup>=0.17",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
]

[tool.pytest]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
log_level = "CRITICAL"                # logs go to stdout, see conftest.py
norecursedirs = ["*.tmp"]
strict = true

[tool.ruff]
line-length = 80
