# Python project metadata, including dependencies & tool settings               
# https://snarky.ca/what-the-heck-is-pyproject-toml

[project]
name = "ok_arduino_clock64_tests"
version = "0.1"
requires-python = ">=3.12"

dependencies = [
  "adafruit-nrfutil>=0.5.3.post16",
  "filelock>=4.1.1",
  "ok-logging-setup>=0.17",
  "ok-subprocess-runner>=0.5",
  "pytest>=9.1.1",
  "pytest-xdist>=3.8.0",
  "pyyaml>=6.0.3",
]

[tool.pytest]
addopts = ["--import-mode=importlib"]
log_level = "CRITICAL"                # logs go to stdout, see conftest.py
norecursedirs = ["*.tmp"]
strict = true

[tool.ruff]
line-length = 80
