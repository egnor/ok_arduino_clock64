[tools]
arduino = "1.3.1"
python = "3.12"
uv = "0.13"
"github:renode/renode" = { version = "1.17.0", matching = "linux-portable" }

[settings]
experimental = true
python.uv_venv_auto = "create|source"

[env]
ARDUINO_DIRECTORIES_DATA = "{{config_root}}/build.tmp/arduino"
ARDUINO_LIBRARY_ENABLE_UNSAFE_INSTALL = "true"
UV_PROJECT_ENVIRONMENT = "{{config_root}}/build.tmp/python_venv"

[hooks]
postinstall = """
  echo '[arduino-cli]'; arduino-cli update
  echo '[uv]'; uv sync
"""
